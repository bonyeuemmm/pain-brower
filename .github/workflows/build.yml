name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          flutter create --project-name pain_music .
          git checkout -- lib/main.dart pubspec.yaml || true

      - name: Fix AndroidManifest (thêm quyền Internet)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Thêm quyền Internet nếu chưa có
          if ! grep -q "android.permission.INTERNET" $MANIFEST; then
            sed -i 's/<manifest /<manifest /' $MANIFEST
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi
          # Cho phép cleartext (phòng trường hợp cần)
          sed -i 's/android:name="android.app.Application"/android:name="android.app.Application" android:usesCleartextTraffic="true"/' $MANIFEST || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pain-music-apk
          path: build/app/outputs/flutter-apk/app-release.apk
